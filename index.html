<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Brawl Stars Test</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style> body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; } </style>
</head>
<body>
<script>
    const config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        physics: { default: 'arcade' },
        scene: { preload: preload, create: create, update: update }
    };

    const game = new Phaser.Game(config);
    let socket;
    let otherPlayers = {};
    let myPlayer;
    let cursors;

    function preload() {}

    function create() {
        // RENDER WEB SERVICE ADRESİNİ BURAYA YAZACAKSIN 🔗
        socket = io('https://SENIN-WEB-SERVICE-ADRESIN.onrender.com');

        cursors = this.input.keyboard.createCursorKeys();

        socket.on('currentPlayers', (players) => {
            Object.keys(players).forEach((id) => {
                if (id === socket.id && !myPlayer) {
                    // Kendi karakterimiz (Mavi Daire)
                    myPlayer = this.add.circle(players[id].x, players[id].y, 20, 0x0000ff);
                    this.physics.add.existing(myPlayer);
                } else if (id !== socket.id && !otherPlayers[id]) {
                    // Diğer oyuncular (Kırmızı Daire)
                    otherPlayers[id] = this.add.circle(players[id].x, players[id].y, 20, 0xff0000);
                }
            });
        });

        socket.on('playerMoved', (playerInfo) => {
            if (otherPlayers[playerInfo.id]) {
                otherPlayers[playerInfo.id].setPosition(playerInfo.x, playerInfo.y);
            }
        });

        socket.on('playerDisconnected', (id) => {
            if (otherPlayers[id]) {
                otherPlayers[id].destroy();
                delete otherPlayers[id];
            }
        });
    }

    function update() {
        if (myPlayer) {
            let moved = false;
            if (cursors.left.isDown) { myPlayer.x -= 4; moved = true; }
            if (cursors.right.isDown) { myPlayer.x += 4; moved = true; }
            if (cursors.up.isDown) { myPlayer.y -= 4; moved = true; }
            if (cursors.down.isDown) { myPlayer.y += 4; moved = true; }

            if (moved) {
                socket.emit('playerMovement', { x: myPlayer.x, y: myPlayer.y });
            }
        }
    }
</script>
</body>
</html>
